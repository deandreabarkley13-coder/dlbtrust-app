app = 'dlbtrust-app'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  TRUST_CHECKER_EMAIL = 'deandreabarkley13@gmail.com'
  MELIO_SOURCE_TYPE = 'trust'
  MELIO_SOURCE_ACCOUNT_ID = '1000'
  MELIO_ALLOWED_SOURCE_ACCOUNTS = '1000'
  TRUST_SEGREGATED_ACCOUNT_CODES = '1210'
  PORT = '3002'
  NODE_ENV = 'production'
  FINERACT_URL = 'http://dlbtrust-fineract.internal:8443/fineract-provider/api/v1'
  PAYMENT_HUB_MODE = 'disabled'
  PAYMENT_HUB_LIVE = 'false'
  MELIO_EXPORT_DIR = '/data/melio-exports'
  TRUST_SIGNATURE_DOCUMENT_PATH = '/data/governance/Trustees_Signature_Page.pdf'

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'dlbtrust_data'
  destination = '/data'
