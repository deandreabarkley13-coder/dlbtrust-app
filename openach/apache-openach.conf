<VirtualHost *:80>
	DocumentRoot /var/www/openach

	<Directory /var/www/openach>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted

		# Yii path-format urls (showScriptName=false): anything that is not a
		# real file or directory is a controller route.
		RewriteEngine on
		RewriteBase /
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule . index.php [L]
	</Directory>

	# The application, its config and the SQLite/runtime state must never be
	# readable over HTTP.
	<DirectoryMatch "/var/www/openach/(protected|vendor)/">
		Require all denied
	</DirectoryMatch>

	# Northflank terminates TLS at the edge; keep Yii from emitting http:// urls.
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
	LogLevel warn
</VirtualHost>
