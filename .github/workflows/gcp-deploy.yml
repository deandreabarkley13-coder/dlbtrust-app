name: GCP Deploy

# Builds the Dockerfile, pushes it to Artifact Registry and rolls the Cloud Run
# service on every push to main. Authenticates through Workload Identity
# Federation (infra/gcp/deploy_identity.tf) — no GCP key is stored in GitHub.
#
# The GCP_* values are resource names, not credentials (terraform output
# workload_identity_provider / deployer_service_account); repository variables
# of the same name override them.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: gcp-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'dlb-treasury-management' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-east1' }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/514695212719/locations/global/workloadIdentityPools/github/providers/github-oidc' }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT || 'dlbtrust-app-deployer@dlb-treasury-management.iam.gserviceaccount.com' }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    env:
      SERVICE: dlbtrust-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        run: echo "IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/dlbtrust/dlbtrust-app" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE:$GITHUB_SHA" \
            --quiet

      - name: Smoke check
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format 'value(status.url)')
          curl -fsS "$url/api/health/ready"

      # Platform engine readiness (payment, gateway, clearing, reconciliation,
      # interop, credit, debt, liquidity, funding-os) on dlb-treasury-management. Informational: the credit
      # engine stays BLOCKED until a real-value funding source exists, so a
      # non-ready engine here does not fail the deploy.
      - name: Engine readiness report
        continue-on-error: true
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format 'value(status.url)')
          token=$(gcloud secrets versions access latest --secret ADMIN_SECRET_TOKEN --project "$GCP_PROJECT_ID" 2>/dev/null || true)
          if [ -z "$token" ]; then echo "ADMIN_SECRET_TOKEN not readable; skipping engine readiness"; exit 0; fi
          echo "::add-mask::$token"
          curl -sS -H "x-admin-token: $token" "$url/api/os/readiness" \
            | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const r=JSON.parse(s);
                console.log(`project=${r.gcp.project} ready=${r.readyCount}/${r.total}`);
                for (const [k,e] of Object.entries(r.engines)) {
                  console.log(`${e.ready?"READY  ":"BLOCKED"} ${k.padEnd(15)} mode=${e.mode} provider=${e.provider}`);
                  for (const b of e.blockers||[]) console.log(`         - ${b}`);
                }
              });'
