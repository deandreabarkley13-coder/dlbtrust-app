app = 'dlbtrust-btcpay'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  BTCPAY_EXTERNALURL = 'https://dlbtrust-btcpay.fly.dev/'
  BTCPAY_NETWORK = 'mainnet'
  BTC_RPCUSER = 'btcrpc'

[http_service]
  internal_port = 23000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[mounts]
  source = 'dlbtrust_btcpay_data'
  destination = '/data'
