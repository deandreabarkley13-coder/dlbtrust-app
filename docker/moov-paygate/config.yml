logging:
  format: plain

http:
  bindAddress: ":8082"

admin:
  bindAddress: ":9092"

organization:
  header: "X-Organization"
  default: "dlbtrust"

database:
  sqlite:
    path: "/data/paygate.db"

customers:
  endpoint: "http://moov-customers:8087"
  accounts:
    decryptor:
      symmetric:
        # The symmetric key is injected by docker-compose from MOOV_PAYGATE_SYMMETRIC_KEY.
        # Never commit a real key here; generate one with scripts/generate-moov-symmetric-key.sh
        keyURI: "base64key://__MOOV_PAYGATE_SYMMETRIC_KEY__"

odfi:
  routingNumber: "111000025"
  gateway:
    origin: "111000025"
    originName: "DLB Trust PTC Bank"
    destination: "011000015"
    destinationName: "FRBNY"
  cutoffs:
    timezone: "America/New_York"
    windows:
      - "16:15"
  inboundPath: "/inbound"
  outboundPath: "/outbound"
  returnPath: "/returned"

pipeline:
  merging:
    directory: "/data/merging"
  output:
    format: "nacha"
