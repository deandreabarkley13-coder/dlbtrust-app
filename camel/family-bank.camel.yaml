          - to:
              uri: "{{dlbtrust.baseUrl}}/api/camel/inbox/family-bank-advice"
          - log:
              message: "family-bank-advice mediated ${header.X-Camel-Message-Key}"
          # transform(normalizeAdvice)
          # filter(adviceHasOutcome)
          # process(applyAdvice)
          # wireTap(trust.payment.settled)
  - route:
      id: family-bank-file-batch
      description: "One ERP or bank instruction file becomes one exchange per instruction."
      from:
        uri: "platform-http:/api/camel/inbox/family-bank-file-batch"
        steps:
          - setHeader:
              name: CamelHttpMethod
              constant: POST
          - setHeader:
