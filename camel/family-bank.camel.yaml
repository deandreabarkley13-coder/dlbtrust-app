          - bean:
              ref: inboxSigner
              method: sign
          - to:
              uri: "{{dlbtrust.baseUrl}}/api/camel/inbox/family-bank-manual-rail"
          - log:
              message: "family-bank-manual-rail mediated ${header.X-Camel-Message-Key}"
          # process(flagManualRail)
          # wireTap(trust.payment.transmitted)
  - route:
      id: family-bank-openach-status
      description: "Poll OpenACH for the status of every originated entry and confirm what it reports."
      from:
        uri: "timer:openach-status?period=300000"
        steps:
          - setHeader:
              name: CamelHttpMethod
              constant: POST
          - setHeader:
              name: X-Camel-Route
              constant: family-bank-openach-status
          - bean:
              ref: inboxSigner
              method: sign
          - to:
              uri: "{{dlbtrust.baseUrl}}/api/camel/inbox/family-bank-openach-status"
          - log:
              message: "family-bank-openach-status mediated ${header.X-Camel-Message-Key}"
          # process(pollOpenAchStatuses)
          # wireTap(trust.payment.settled)
  - route:
      id: family-bank-advice
      description: "An inbound rail advice: the only path from dispatched to settled, returned or failed."
      from:
        uri: "platform-http:/api/camel/inbox/family-bank-advice"
        steps:
          - setHeader:
              name: CamelHttpMethod
              constant: POST
          - setHeader:
