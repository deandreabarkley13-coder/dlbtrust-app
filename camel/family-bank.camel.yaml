          - to:
              uri: "{{dlbtrust.baseUrl}}/api/camel/inbox/family-bank-file-batch"
          - log:
              message: "family-bank-file-batch mediated ${header.X-Camel-Message-Key}"
          # split(instructionsInFile) -> family-bank-ingress
  - route:
      id: family-bank-bus-driver
      description: "Drive pending exchanges in the application context, including redeliveries."
      from:
        uri: "timer:family-bank-bus?period=60000"
        steps:
          - setHeader:
              name: CamelHttpMethod
              constant: POST
          - bean:
              ref: inboxSigner
              method: sign
          - to:
              uri: "{{dlbtrust.baseUrl}}/api/camel/drive"
          - log:
              message: "bus drive: ${body}"
